name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project ships without its own Gradle wrapper (gradlew /
      # gradle-wrapper.jar), so we install Gradle directly instead of
      # calling ./gradlew.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Optional: if you added a GEMINI_API_KEY secret in this repo's
      # Settings -> Secrets and variables -> Actions, this writes it into
      # a local .env file so the AI (Hamdam) features work in the APK.
      # If you skip this, the app still builds fine - the AI calls just
      # won't work until a key is added.
      - name: Write .env (optional Gemini key)
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gapoo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
